default_install_hook_types:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: format-check
        name: frontend prettier check
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/frontend" && npm run format:check'
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: lint
        name: frontend eslint
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/frontend" && npm run lint'
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: test-coverage
        name: frontend vitest coverage
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/frontend" && npm run test:coverage'
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: build
        name: frontend build
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/frontend" && npm run build'
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]
