default_install_hook_types:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: backend ruff format check
        entry: uv run ruff format --check
        language: system
        stages: [pre-commit, manual]
        types_or: [python, pyi]

      - id: ruff-check
        name: backend ruff check
        entry: uv run ruff check
        language: system
        stages: [pre-commit, manual]
        types_or: [python, pyi]

      - id: mypy
        name: backend mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: pytest
        name: backend pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]
