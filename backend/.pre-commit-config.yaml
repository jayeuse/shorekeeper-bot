default_install_hook_types:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: backend ruff format check
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/backend" && uv run ruff format --check .'
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: ruff-check
        name: backend ruff check
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/backend" && uv run ruff check .'
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: mypy
        name: backend mypy
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/backend" && uv run mypy'
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: pytest
        name: backend pytest
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)/backend" && uv run pytest'
        language: system
        pass_filenames: false
        stages: [pre-commit, manual]
