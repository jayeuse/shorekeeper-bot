[project]
name = "shorekeeper-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.3",
    "aiosignal==1.4.0",
    "alembic==1.17.1",
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "attrs==25.4.0",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.5",
    "cryptography==46.0.5",
    "discord==2.3.2",
    "discord-py==2.7.1",
    "distro==1.9.0",
    "frozenlist==1.8.0",
    "openai>=1.60.0",
    "psycopg2-binary>=2.9.10",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "multidict==6.7.1",
    "numpy==2.4.2",
    "ollama==0.6.1",
    "propcache==0.4.1",
    "pyasn1==0.6.2",
    "pyasn1-modules==0.4.2",
    "pycparser==3.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "python-dotenv==1.2.1",
    "pyyaml==6.0.3",
    "requests==2.32.5",
    "rsa==4.9.1",
    "sniffio==1.3.1",
    "sqlmodel==0.0.22",
    "tabulate==0.10.0",
    "tenacity==9.1.4",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.6.3",
    "websockets==16.0",
    "yarl==1.23.0",
    "fastapi==0.102.0",
    "uvicorn[standard]==0.22.0",
    "trafilatura>=2.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "types-pyyaml>=6.0.12.20260518",
    "types-tabulate>=0.10.0.20260508",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["brain/data", "brain/knowledge"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
mypy_path = ["brain"]
explicit_package_bases = true
files = ["brain", "server"]
exclude = ["brain/data", "brain/knowledge"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["brain/tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=database",

    "--cov=services.rag",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=70",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
