name: shorekeeper-searxng

services:
  core:
    container_name: shorekeeper-searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: "no"
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.example
        required: true
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./core-config:/etc/searxng/
      - searxng-cache:/var/cache/searxng/
    depends_on:
      - valkey

  valkey:
    container_name: shorekeeper-searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: "no"
    volumes:
      - valkey-data:/data/

volumes:
  searxng-cache:
  valkey-data:
